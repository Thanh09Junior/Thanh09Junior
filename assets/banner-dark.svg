<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img">
  <title>V.T.Thanh Assistant — field notebook header, dark</title>
  <!-- soil canvas -->
  <rect x="0" y="0" width="1280" height="320" fill="#1C1E13"/>
  <!-- survey grid, sand at 8% -->
  <g stroke="#AC9A6D" stroke-width="1" opacity="0.08">
    <line x1="40" y1="0" x2="40" y2="320"/><line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="280" y1="0" x2="280" y2="320"/><line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="440" y1="0" x2="440" y2="320"/><line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="520" y1="0" x2="520" y2="320"/><line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/><line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="680" y1="0" x2="680" y2="320"/><line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="760" y1="0" x2="760" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="840" y1="0" x2="840" y2="320"/><line x1="880" y1="0" x2="880" y2="320"/>
    <line x1="920" y1="0" x2="920" y2="320"/><line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/><line x1="1040" y1="0" x2="1040" y2="320"/>
    <line x1="1080" y1="0" x2="1080" y2="320"/><line x1="1120" y1="0" x2="1120" y2="320"/>
    <line x1="1160" y1="0" x2="1160" y2="320"/><line x1="1200" y1="0" x2="1200" y2="320"/>
    <line x1="1240" y1="0" x2="1240" y2="320"/>
    <line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
  </g>
  <!-- topographic contours, sand 12% -->
  <g fill="none" stroke="#AC9A6D" stroke-width="1.5" opacity="0.12">
    <path d="M -40 300 C 180 250, 420 310, 660 270 S 1120 240, 1340 290"/>
    <path d="M -40 40 C 260 90, 560 20, 900 70 S 1200 40, 1340 60"/>
    <path d="M -40 140 C 300 120, 620 180, 980 150 S 1240 130, 1340 150"/>
  </g>
  <!-- left third: monogram seal, scaled -->
  <g transform="translate(160,150) scale(0.75)">
    <g transform="translate(-100,-100)">
      <circle cx="100" cy="100" r="88" fill="none" stroke="#AC9A6D" stroke-width="2"
              stroke-dasharray="6 5" opacity="0.9"/>
      <circle cx="100" cy="100" r="72" fill="none" stroke="#AC9A6D" stroke-width="1.5" opacity="0.45"/>
      <line x1="100" y1="6" x2="100" y2="18" stroke="#AC9A6D" stroke-width="2"/>
      <line x1="182" y1="100" x2="194" y2="100" stroke="#AC9A6D" stroke-width="2"/>
      <line x1="100" y1="182" x2="100" y2="194" stroke="#AC9A6D" stroke-width="2"/>
      <line x1="6" y1="100" x2="18" y2="100" stroke="#AC9A6D" stroke-width="2"/>
      <text x="100" y="102" text-anchor="middle" dominant-baseline="middle"
            font-family="Georgia, 'Times New Roman', serif" font-size="30"
            letter-spacing="3" fill="#C8CFA0">V.T.T.A</text>
      <text x="100" y="138" text-anchor="middle"
            font-family="'Courier New', Courier, monospace" font-size="13"
            letter-spacing="4" fill="#C8CFA0">001</text>
    </g>
  </g>
  <!-- right two-thirds: text block, left edge x=400 -->
  <!-- label row -->
  <text x="400" y="78" font-family="'Courier New', Courier, monospace" font-size="17"
        letter-spacing="5" fill="#C8CFA0">FIELD NOTEBOOK · 001</text>
  <text x="1240" y="78" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="17"
        letter-spacing="5" fill="#C8CFA0">EST. 2023 · SAIGON</text>
  <!-- title -->
  <text x="400" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="62"
        fill="#EDE7D3">V.T.Thanh Assistant</text>
  <!-- sand rule -->
  <rect x="400" y="190" width="620" height="2" fill="#AC9A6D"/>
  <!-- subtitle -->
  <text x="400" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="22"
        fill="#C8CFA0">Supervisor &amp; orchestrator agent — on the OpenHands platform</text>
  <!-- status tag pill -->
  <rect x="400" y="256" width="130" height="30" rx="15" fill="#1C1E13" stroke="#AC9A6D" stroke-width="1.5"/>
  <text x="465" y="276" text-anchor="middle" font-family="'Courier New', Courier, monospace"
        font-size="14" letter-spacing="2" fill="#C8CFA0">[ ACTIVE ]</text>
</svg>
